<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="WakeSki"/>
<meta name="theme-color" content="#000000"/>
<title>WakeSki Pro v3.5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');

:root{
--bg:#000;--bg2:#111;
--glass:rgba(255,255,255,.05);--gb:rgba(255,255,255,.10);--gs:rgba(255,255,255,.08);
--ac:#0a84ff;--ac-g:rgba(10,132,255,.30);--ac-l:rgba(10,132,255,.13);
--green:#30d158;--green-g:rgba(48,209,88,.25);
--red:#ff453a;--red-g:rgba(255,69,58,.30);
--yellow:#ffd60a;--yellow-g:rgba(255,214,10,.25);
--tx:rgba(255,255,255,.92);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.28);
--fd:'Barlow Condensed',sans-serif;--fb:'DM Sans',sans-serif;
--nav:82px;--sb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{height:100%;width:100%;background:#000;color:var(--tx);font-family:var(--fb);overflow:hidden;touch-action:manipulation;}
#app{height:100dvh;display:flex;flex-direction:column;position:relative;max-width:430px;margin:0 auto;}
.page{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 20px);display:none;}
.page.active{display:block;animation:fadeUp .3s ease-out;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* NAV */
#nav{position:fixed;bottom:0;width:100%;max-width:430px;height:var(--nav);background:rgba(8,8,8,.9);backdrop-filter:blur(20px);border-top:.5px solid var(--gb);display:flex;justify-content:space-around;padding:10px 0 var(--sb);z-index:100;}
.nav-btn{background:none;border:none;color:#8e8e93;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;width:33%;}
.nav-btn svg{width:24px;height:24px;transition:0.2s;}.nav-btn.active{color:var(--ac);}.nav-btn.active svg{transform:scale(1.1);}

/* TRACK PAGE */
.track-hdr{padding:50px 20px 0;display:flex;justify-content:space-between;align-items:center;}
.gps-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--glass);border-radius:20px;font-size:12px;}
.gps-dot{width:8px;height:8px;border-radius:50%;background:#444;}
.gps-dot.ready{background:var(--green);box-shadow:0 0 8px var(--green-g);}
.gps-dot.waiting{background:var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.3}}

.speed-wrap{display:flex;justify-content:center;padding:20px 0;}
.speed-ring{position:relative;width:220px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-svg{position:absolute;inset:0;transform:rotate(-90deg);width:100%;height:100%;}
.ring-bg{fill:none;stroke:var(--gb);stroke-width:4;}
.ring-fill{fill:none;stroke:var(--ac);stroke-width:5;stroke-linecap:round;stroke-dasharray:603;stroke-dashoffset:603;transition:0.4s cubic-bezier(.34,1,.64,1);}
.speed-num{font-family:var(--fd);font-size:90px;font-weight:900;line-height:1;}
.speed-unit{font-size:14px;color:var(--tx2);margin-top:-5px;}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px;margin-bottom:15px;}
.mc{background:var(--glass);border:.5px solid var(--gb);border-radius:14px;padding:10px 5px;text-align:center;}
.mv{font-family:var(--fd);font-size:22px;font-weight:800;line-height:1;}
.ml{font-size:9px;color:var(--tx2);text-transform:uppercase;margin-top:4px;}

.tbtn-wrap{padding:0 16px;margin-bottom:15px;}
.tbtn{width:100%;height:64px;border-radius:18px;border:none;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:0.2s;}
.tbtn.start{background:var(--ac);color:white;box-shadow:0 0 20px var(--ac-g);}
.tbtn.stop{background:var(--red);color:white;}
.tbtn:disabled{opacity:0.4;}

.map-wrap{margin:0 16px;height:220px;border-radius:18px;overflow:hidden;border:.5px solid var(--gb);position:relative;background:#111;}
#live-map{width:100%;height:100%;}

/* SETTINGS / HISTORY */
.s-section{margin:15px 16px;background:var(--glass);border-radius:18px;overflow:hidden;border:.5px solid var(--gb);}
.s-row{padding:14px 16px;border-bottom:.5px solid var(--gb);display:flex;align-items:center;gap:12px;}
.s-row:last-child{border-bottom:none;}
.run-card{margin:0 16px 10px;padding:16px;background:var(--glass);border-radius:20px;border:.5px solid var(--gb);}

/* OVERLAYS */
#screen-perm{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;}
.btn{padding:16px 30px;border-radius:16px;border:none;font-weight:700;font-size:16px;cursor:pointer;width:100%;}
.btn-primary{background:var(--ac);color:white;}
</style>
</head>
<body>

<div id="screen-perm">
  <h1 style="font-family:var(--fd);font-size:50px;margin-bottom:10px;">WakeSki Pro</h1>
  <p style="color:var(--tx2);margin-bottom:40px;text-align:center;">Version 3.5 - Live-Tracking Fix</p>
  <button class="btn btn-primary" id="perm-btn">GPS & Sensoren aktivieren</button>
</div>

<div id="app" style="display:none;">
  <div id="page-track" class="page">
    <div class="track-hdr">
      <h1 style="font-family:var(--fd);font-size:32px;">Live Track</h1>
      <div class="gps-badge"><div class="gps-dot" id="gps-dot"></div><span id="gps-status">GPS Suche...</span></div>
    </div>
    
    <div class="speed-wrap">
      <div class="speed-ring">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="96"/>
          <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="96"/>
        </svg>
        <div class="speed-num" id="speed-num">0</div>
        <div class="speed-unit">KM/H</div>
      </div>
    </div>

    <div class="metrics">
      <div class="mc"><div class="mv" id="m-max">0.0</div><div class="ml">Max</div></div>
      <div class="mc"><div class="mv" id="m-avg">0.0</div><div class="ml">Avg</div></div>
      <div class="mc"><div class="mv" id="m-dist">0</div><div class="ml" id="m-dist-unit">m</div></div>
      <div class="mc"><div class="mv" id="m-time">0:00</div><div class="ml">Zeit</div></div>
    </div>

    <div class="tbtn-wrap">
      <button class="tbtn start" id="track-btn" disabled>Run starten</button>
    </div>

    <div class="map-wrap">
      <div id="live-map"></div>
    </div>
  </div>

  <div id="page-history" class="page">
    <div style="padding:50px 20px 10px;"><h1 style="font-family:var(--fd);font-size:32px;">Verlauf</h1></div>
    <div id="runs-list"></div>
  </div>

  <div id="page-settings" class="page">
    <div style="padding:50px 20px 10px;"><h1 style="font-family:var(--fd);font-size:32px;">Mehr</h1></div>
    <div class="s-section">
      <div class="s-row"><div><strong>Version:</strong> v3.5 (Stable Live)</div></div>
      <div class="s-row" onclick="localStorage.clear();location.reload();">Daten zurücksetzen</div>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-btn active" onclick="goPage('track')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>
      Track
    </button>
    <button class="nav-btn" onclick="goPage('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Verlauf
    </button>
    <button class="nav-btn" onclick="goPage('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06-.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Mehr
    </button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let state = {
  active: false,
  lat: 48.2, lon: 13.5,
  speed: 0, maxSpeed: 0, avgSpeed: 0,
  dist: 0, time: 0, tStart: null,
  points: [], lastPt: null,
  map: null, marker: null, polyline: null
};

// Haversine Distanz für Speed-Fallback
function getDist(p1, p2) {
  const R = 6371;
  const dLat = (p2.lat - p1.lat) * Math.PI / 180;
  const dLon = (p2.lon - p1.lon) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function goPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  $('page-'+p).classList.add('active');
  if(p === 'track' && state.map) {
    setTimeout(() => state.map.invalidateSize(), 100);
  }
}

function updateUI() {
  $('speed-num').textContent = Math.round(state.speed);
  const offset = 603 * (1 - Math.min(state.speed/60, 1));
  $('ring-fill').style.strokeDashoffset = offset;

  if(state.active) {
    $('m-max').textContent = state.maxSpeed.toFixed(1);
    $('m-avg').textContent = state.avgSpeed.toFixed(1);
    if(state.dist < 1) {
      $('m-dist').textContent = Math.round(state.dist * 1000);
      $('m-dist-unit').textContent = "m";
    } else {
      $('m-dist').textContent = state.dist.toFixed(2);
      $('m-dist-unit').textContent = "km";
    }
  }
}

function initMap() {
  if(state.map) return;
  state.map = L.map('live-map', {zoomControl: false, attributionControl: false}).setView([state.lat, state.lon], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(state.map);
  state.marker = L.circleMarker([state.lat, state.lon], {radius: 8, color: '#fff', fillColor: '#0a84ff', fillOpacity: 1, weight: 3}).addTo(state.map);
  state.polyline = L.polyline([], {color: '#0a84ff', weight: 5}).addTo(state.map);
}

function onPos(pos) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const now = Date.now();
  
  // 1. Live Speed Logik (mit Fallback)
  let s = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
  if(s < 1 && state.lastPt) {
    const d = getDist(state.lastPt, {lat, lon});
    const dt = (now - state.lastPt.time) / 1000;
    if(dt > 0 && dt < 5) s = (d/dt) * 3600;
  }
  state.speed = s;
  
  // 2. Map Update (Immer!)
  if(state.map) {
    state.lat = lat; state.lon = lon;
    state.marker.setLatLng([lat, lon]);
    state.map.panTo([lat, lon]);
  }

  // 3. Wenn Run läuft
  if(state.active) {
    if(state.lastPt) state.dist += getDist(state.lastPt, {lat, lon});
    state.maxSpeed = Math.max(state.maxSpeed, s);
    state.points.push({lat, lon, s, t: now});
    state.polyline.addLatLng([lat, lon]);
    
    const moving = state.points.filter(p => p.s > 2);
    if(moving.length > 0) state.avgSpeed = moving.reduce((a,b)=>a+b.s,0) / moving.length;
  }

  state.lastPt = {lat, lon, time: now};
  $('gps-dot').className = "gps-dot ready";
  $('gps-status').textContent = "GPS bereit";
  $('track-btn').disabled = false;
  updateUI();
}

$('track-btn').onclick = () => {
  if(!state.active) {
    state.active = true;
    state.points = []; state.dist = 0; state.maxSpeed = 0; state.avgSpeed = 0;
    state.tStart = Date.now();
    state.polyline.setLatLngs([]);
    $('track-btn').textContent = "Run beenden";
    $('track-btn').className = "tbtn stop";
    state.timer = setInterval(() => {
      const diff = Date.now() - state.tStart;
      const m = Math.floor(diff/60000);
      const s = Math.floor((diff%60000)/1000);
      $('m-time').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }, 1000);
  } else {
    state.active = false;
    clearInterval(state.timer);
    saveRun();
    $('track-btn').textContent = "Run starten";
    $('track-btn').className = "tbtn start";
  }
};

function saveRun() {
  const runs = JSON.parse(localStorage.getItem('ws_runs') || '[]');
  runs.unshift({
    id: Date.now(),
    date: new Date().toLocaleString(),
    max: state.maxSpeed,
    avg: state.avgSpeed,
    dist: state.dist,
    time: $('m-time').textContent
  });
  localStorage.setItem('ws_runs', JSON.stringify(runs));
  renderHistory();
}

function renderHistory() {
  const runs = JSON.parse(localStorage.getItem('ws_runs') || '[]');
  $('runs-list').innerHTML = runs.map(r => `
    <div class="run-card">
      <div style="font-size:12px;color:var(--tx2);margin-bottom:8px;">${r.date}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><span style="font-size:24px;font-weight:800;font-family:var(--fd);">${Math.round(r.max)}</span> km/h</div>
        <div style="text-align:right;">${r.dist.toFixed(2)} km<br><small>${r.time}</small></div>
      </div>
    </div>
  `).join('');
}

$('perm-btn').onclick = () => {
  navigator.geolocation.watchPosition(onPos, (e) => console.log(e), {enableHighAccuracy: true});
  $('screen-perm').style.display = 'none';
  $('app').style.display = 'flex';
  initMap();
  renderHistory();
};
</script>
</body>
</html>
