<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="WakeSki"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark"/>
<title>WakeSki Pro v3.5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');

*,*::before,*::after{
box-sizing:border-box;margin:0;padding:0;
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
input,textarea{user-select:text;-webkit-user-select:text}

:root{
--bg:#000;--bg2:#111;
--glass:rgba(255,255,255,.05);--gb:rgba(255,255,255,.10);--gs:rgba(255,255,255,.08);
--ac:#0a84ff;--ac-g:rgba(10,132,255,.30);--ac-l:rgba(10,132,255,.13);
--green:#30d158;--green-g:rgba(48,209,88,.25);
--red:#ff453a;--red-g:rgba(255,69,58,.30);
--yellow:#ffd60a;--yellow-g:rgba(255,214,10,.25);
--tx:rgba(255,255,255,.92);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.28);
--fd:'Barlow Condensed',sans-serif;--fb:'DM Sans',sans-serif;
--nav:82px;--sb:env(safe-area-inset-bottom,0px);
color-scheme:dark;
}
html,body{
height:100%;width:100%;
background:#000;background:var(--bg);
color:var(--tx);
font-family:var(--fb);-webkit-font-smoothing:antialiased;
overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{
height:100vh;height:100dvh;
display:flex;flex-direction:column;
position:relative;overflow:hidden;
max-width:430px;margin:0 auto;
}
#app::before{
content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.3;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav) + 16px);display:none;}
.page.active{display:block;animation:fadeUp .38s cubic-bezier(.34,1.28,.64,1) both;}
.page::-webkit-scrollbar{display:none}

@keyframes fadeUp  {from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn  {from{opacity:0}to{opacity:1}}
@keyframes slideUp {from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes pulse   {0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ripple  {0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.4);opacity:0}}
@keyframes spin    {to{transform:rotate(360deg)}}
@keyframes glow    {0%,100%{box-shadow:0 0 20px var(--ac-g)}50%{box-shadow:0 0 44px var(--ac-g),0 0 70px rgba(10,132,255,.10)}}
@keyframes lockFill{from{width:0}to{width:100%}}

/* NAVIGATION */
#nav{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);
width:100%;max-width:430px;height:var(--nav);
background:rgba(8,8,8,.90);
backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
border-top:.5px solid var(--gb);
display:flex;align-items:flex-start;justify-content:space-around;
z-index:200;padding:10px 0 calc(10px + var(--sb));
}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:#8e8e93;cursor:pointer;padding:8px 20px;border-radius:14px;font-family:var(--fb);font-size:10px;font-weight:500;transition:color .2s}
.nav-btn svg{width:24px;height:24px;transition:transform .2s cubic-bezier(.34,1.6,.64,1)}
.nav-btn.active{color:var(--ac)}.nav-btn.active svg{transform:scale(1.1)}

/* BUTTONS & UI */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border-radius:16px;border:none;cursor:pointer;font-family:var(--fb);font-size:16px;font-weight:600;transition:all .18s cubic-bezier(.34,1.4,.64,1);width:100%}
.btn:active{transform:scale(.965)}
.btn-primary{background:var(--ac);color:#fff;box-shadow:0 4px 24px var(--ac-g)}
.btn-danger {background:var(--red);color:#fff;box-shadow:0 4px 24px var(--red-g)}
.btn-ghost  {background:var(--gs);border:.5px solid var(--gb);color:var(--tx)}
.btn-sm     {padding:9px 16px;font-size:13px;border-radius:12px;width:auto}

/* PERMISSION SCREEN */
#screen-perm{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;animation:fadeIn .4s ease both}
.perm-logo{font-family:var(--fd);font-size:60px;font-weight:900;color:#fff;letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 60px rgba(10,132,255,.5)}
.perm-tag{font-size:14px;color:var(--tx2);margin-bottom:44px}
.perm-list{width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.perm-item{display:flex;align-items:center;gap:16px;padding:15px 16px;background:var(--glass);border:.5px solid var(--gb);border-radius:18px;animation:fadeUp .4s cubic-bezier(.34,1.2,.64,1) both}
.perm-ico{width:42px;height:42px;border-radius:11px;background:var(--ac-l);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.perm-ico svg{width:20px;height:20px;color:var(--ac)}
.perm-t{font-size:15px;font-weight:600;margin-bottom:2px}.perm-s{font-size:12px;color:var(--tx2)}

/* TRACK PAGE STYLES */
.track-hdr{padding:52px 20px 0;display:flex;align-items:center;justify-content:space-between}
.track-title{font-family:var(--fd);font-size:34px;font-weight:900}
.gps-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--glass);border:.5px solid var(--gb);font-size:12px;font-weight:500}
.gps-dot{width:7px;height:7px;border-radius:50%;background:#48484a;flex-shrink:0}
.gps-dot.waiting{background:var(--yellow);animation:pulse 1.4s infinite}
.gps-dot.ready{background:var(--green);box-shadow:0 0 8px var(--green-g)}

.speed-wrap{display:flex;flex-direction:column;align-items:center;padding:24px 20px 16px}
.speed-ring{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.speed-ring .ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:3}
.ring-fill{fill:none;stroke:var(--ac);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:603;stroke-dashoffset:603;transition:stroke-dashoffset .5s cubic-bezier(.34,1.2,.64,1),stroke .3s ease;filter:drop-shadow(0 0 7px var(--ac))}
.speed-num{font-family:var(--fd);font-size:90px;font-weight:900;line-height:1;color:#fff;letter-spacing:-2px}
.speed-unit{font-size:14px;color:var(--tx2);margin-top:-4px}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px;margin-bottom:14px}
.mc{background:var(--glass);border:.5px solid var(--gb);border-radius:14px;padding:10px 6px 9px;text-align:center}
.mv{font-family:var(--fd);font-size:22px;font-weight:800;color:var(--tx)}
.ml{font-size:9px;color:var(--tx2);margin-top:3px;text-transform:uppercase}

.tbtn-wrap{padding:0 16px;margin-bottom:12px}
.tbtn{width:100%;height:64px;border-radius:18px;border:none;cursor:pointer;font-family:var(--fb);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .22s cubic-bezier(.34,1.4,.64,1)}
.tbtn.start{background:var(--ac);color:#fff;box-shadow:0 6px 28px var(--ac-g);animation:glow 3s ease-in-out infinite}
.tbtn.stop {background:var(--red);color:#fff;box-shadow:0 6px 28px var(--red-g)}

.map-wrap{margin:0 16px 12px;border-radius:18px;overflow:hidden;border:.5px solid var(--gb);height:220px;position:relative}
#live-map{width:100%;height:100%;background:#0a0d12}

/* WATER LOCK */
#water-lock{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.97);display:none;flex-direction:column;align-items:center;justify-content:center}
#water-lock.on{display:flex;animation:fadeIn .25s ease both}
.wl-btn{width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;touch-action:none}
.wl-progress{position:absolute;bottom:0;left:0;height:4px;background:var(--ac);width:0}

/* LEAFLET DARK MODE */
.leaflet-container{background:#0a0d12 !important}
.leaflet-tile{filter:brightness(.65) saturate(.7) hue-rotate(200deg)}
.leaflet-control-attribution{display:none}
</style>
</head>
<body>

<div id="screen-perm">
  <div class="perm-logo">WakeSki</div>
  <div class="perm-tag">Wasserski · Wakeboard · Pro v3.5</div>
  <div class="perm-list">
    <div class="perm-item">
      <div class="perm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></div>
      <div><div class="perm-t">GPS & Standort</div><div class="perm-s">Echtzeit-Speed & Tracking</div></div>
    </div>
    <div class="perm-item">
      <div class="perm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22V12M12 12L7 7M12 12l5-5"/></svg></div>
      <div><div class="perm-t">Bewegung</div><div class="perm-s">Sturzerkennung via Sensor</div></div>
    </div>
  </div>
  <div class="perm-btn-wrap">
    <button class="btn btn-primary" id="perm-btn">Berechtigungen erteilen</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="page-track" class="page active">
    <div class="track-hdr">
      <div class="track-title">Track</div>
      <div class="gps-badge"><div class="gps-dot" id="gps-dot"></div><span id="gps-label">Suche Satellit...</span></div>
    </div>
    <div class="speed-wrap">
      <div class="speed-ring">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="96"/>
          <circle class="ring-fill" cx="100" cy="100" r="96" id="ring-fill"/>
        </svg>
        <div class="speed-inner">
          <div class="speed-num" id="speed-num">0</div>
          <div class="speed-unit">km/h</div>
        </div>
      </div>
    </div>
    <div class="metrics">
      <div class="mc"><div class="mv" id="m-max">0</div><div class="ml">Max</div></div>
      <div class="mc"><div class="mv" id="m-avg">0</div><div class="ml">Avg</div></div>
      <div class="mc"><div class="mv" id="m-dist">0</div><div class="ml">m</div></div>
      <div class="mc"><div class="mv" id="m-time">0:00</div><div class="ml">Zeit</div></div>
    </div>
    <div class="tbtn-wrap">
      <button class="tbtn start" id="track-btn" disabled>Run starten</button>
    </div>
    <div style="padding:0 16px;margin-bottom:12px;">
      <button class="btn btn-ghost" id="lock-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Wassergeschützt sperren
      </button>
    </div>
    <div class="map-wrap" id="map-wrap" style="display:none;">
      <div id="live-map"></div>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-btn active" onclick="goPage('track')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Track</span>
    </button>
    <button class="nav-btn" onclick="goPage('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Verlauf</span>
    </button>
    <button class="nav-btn" onclick="goPage('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div id="water-lock">
  <div class="wl-ico">💧</div>
  <div class="wl-title">Wasser-Lock</div>
  <div class="wl-sub">Gesperrt gegen ungewollte Eingaben durch Wasser.</div>
  <div class="wl-btn" id="wl-btn">
    <div class="wl-progress" id="wl-prog"></div>
    <div style="font-weight:700;z-index:2">HALTEN</div>
    <div style="font-size:12px;opacity:.6;z-index:2">ZUM ENTSPERREN</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let S = { tracking:false, maxSpeed:0, distance:0, avgSpeed:0, elapsed:0, t0:0, path:[], currentSpeed:0 };
let map, poly, watchId;

/* GPS INITIALISIERUNG - SPEED FIX */
function initGPS() {
  if(!navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(pos => {
    // Echtzeit-Speed vom GPS-Sensor (m/s zu km/h)
    let spd = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
    S.currentSpeed = Math.max(0, spd);
    
    $('gps-dot').className = 'gps-dot ready';
    $('gps-label').innerText = 'Bereit';
    $('track-btn').disabled = false;

    if(S.tracking) {
      updateTracking(pos);
    } else {
      $('speed-num').innerText = Math.round(S.currentSpeed);
      updateRing(S.currentSpeed);
    }
  }, err => {
    $('gps-dot').className = 'gps-dot error';
    $('gps-label').innerText = 'Kein Signal';
  }, { enableHighAccuracy:true, maximumAge:0 });
}

function updateTracking(pos) {
  const {latitude:lat, longitude:lng} = pos.coords;
  const p = [lat, lng];
  
  if(S.path.length > 0) {
    const lastP = S.path[S.path.length-1];
    const d = getDist(lastP[0], lastP[1], lat, lng);
    if(d > 2) { // Nur bei Bewegung von > 2m zählen
       S.distance += d;
       S.path.push(p);
       poly.addLatLng(p);
       map.panTo(p);
    }
  } else {
    S.path.push(p);
  }

  if(S.currentSpeed > S.maxSpeed) S.maxSpeed = S.currentSpeed;
  refreshMetrics();
}

function refreshMetrics() {
  $('speed-num').innerText = Math.round(S.currentSpeed);
  $('m-max').innerText = Math.round(S.maxSpeed);
  $('m-dist').innerText = S.distance > 1000 ? (S.distance/1000).toFixed(2) : Math.round(S.distance);
  $('m-dist-l').innerText = S.distance > 1000 ? 'km' : 'm';
  updateRing(S.currentSpeed);
}

function updateRing(v) {
  const offset = 603 - (Math.min(v, 60) / 60) * 603;
  $('ring-fill').style.strokeDashoffset = offset;
}

function startTracking() {
  S = { ...S, tracking:true, t0:Date.now(), path:[], distance:0, maxSpeed:0 };
  $('track-btn').className = 'tbtn stop';
  $('track-btn-lbl').innerText = 'Run stoppen';
  $('map-wrap').style.display = 'block';
  
  // MAP FIX: Invalidate Size, damit Karte nicht grau bleibt
  if(!map) {
    map = L.map('live-map', {zoomControl:false, attributionControl:false}).setView([0,0], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    poly = L.polyline([], {color:'var(--ac)', weight:4}).addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 100);
}

function stopTracking() {
  S.tracking = false;
  $('track-btn').className = 'tbtn start';
  $('track-btn-lbl').innerText = 'Run starten';
  // Hier Speicher-Logik hinzufügen (localStorage etc.)
}

/* NAVIGATION & UI */
function goPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  $(`page-${p}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (p==='track' && i===0) || (p==='history' && i===1) || (p==='settings' && i===2));
  });
}

$('track-btn').addEventListener('click', () => S.tracking ? stopTracking() : startTracking());

$('perm-btn').addEventListener('click', async () => {
  $('screen-perm').style.display = 'none';
  $('app').style.display = 'flex';
  initGPS();
  // Motion Permission Logic hier...
});

$('lock-btn').addEventListener('click', () => $('water-lock').classList.add('on'));

// Entsperr-Logik (Halten für 2 Sek)
let wlTimer;
$('wl-btn').addEventListener('touchstart', () => {
  $('wl-prog').style.width = '100%';
  $('wl-prog').style.transition = 'width 2s linear';
  wlTimer = setTimeout(() => {
    $('water-lock').classList.remove('on');
    $('wl-prog').style.width = '0';
    $('wl-prog').style.transition = 'none';
  }, 2000);
});
$('wl-btn').addEventListener('touchend', () => {
  clearTimeout(wlTimer);
  $('wl-prog').style.width = '0';
  $('wl-prog').style.transition = 'none';
});

function getDist(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
</script>
</body>
</html>
